[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "printwright"
version = "0.1.0"
description = "Local, spec-first design-to-print workbench: requirements -> spec -> CadQuery CAD -> checks & renders -> Bambu Studio slicing, driven by Claude Code or the OpenAI / Anthropic APIs."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kuan Zhou" }]
requires-python = ">=3.10,<3.14"
keywords = ["3d-printing", "cad", "cadquery", "bambu-studio", "llm", "claude-code", "openai", "slicing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Intended Audience :: Manufacturing",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics :: 3D Modeling",
  "Topic :: Printing",
]
dependencies = [
  "cadquery>=2.4",
  "trimesh>=4.0",
  "manifold3d>=2.4",
  "scikit-image>=0.22",
  "numpy>=1.24",
  "scipy>=1.10",
  "shapely>=2.0",
  "rtree>=1.0",
  "networkx>=3.0",
  "matplotlib>=3.7",
  "pillow>=10.0",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "typer>=0.12",
]

[project.optional-dependencies]
openai = ["openai>=1.60"]
anthropic = ["anthropic>=0.80"]
all = ["openai>=1.60", "anthropic>=0.80"]

[project.scripts]
printwright = "printwright.cli:app"

[project.urls]
Homepage = "https://github.com/kzhou003/printwright"
Issues = "https://github.com/kzhou003/printwright/issues"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[tool.hatch.build.targets.wheel]
packages = ["src/printwright"]

[tool.hatch.build.targets.sdist]
include = ["src/printwright", "tests", "docs", "README.md", "README.zh-CN.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: needs external apps (Bambu Studio, Blender); skipped automatically when they are missing",
]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["src/printwright/static/vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008"]
